<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leaderboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --paper:#f6f3ea; --ink:#1c2620; --muted:#6b7062; --line:#dbd6c4; --surface:#ffffff;
  --green:#1f5c3f; --green-deep:#123826; --green-tint:#e7efe6;
  --accent:#b3452d; --accent-tint:#f6e6df;
  --gold:#a9822f;
  --danger:#b3452d;
  --radius:12px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12160f; --ink:#eef0e6; --muted:#9aa08c; --line:#2b3327; --surface:#191f17;
    --green:#57a578; --green-deep:#3a8158; --green-tint:#1c2a20;
    --accent:#e2794f; --accent-tint:#2e2019;
    --gold:#d9b45c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#12160f; --ink:#eef0e6; --muted:#9aa08c; --line:#2b3327; --surface:#191f17;
  --green:#57a578; --green-deep:#3a8158; --green-tint:#1c2a20;
  --accent:#e2794f; --accent-tint:#2e2019;
  --gold:#d9b45c;
  color-scheme: dark;
}
*{box-sizing:border-box;}
[hidden]{display:none!important;}
html,body{margin:0;padding:0;background:var(--paper);}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  color:var(--ink);
  padding-top:var(--safe-t); padding-bottom:var(--safe-b);
  -webkit-font-smoothing:antialiased;
  min-height:100%;
}
img{max-width:100%;}
h1,h2,h3{font-family:'Fraunces',Georgia,serif; font-weight:600; margin:0; text-wrap:balance;}
.tabular{font-variant-numeric:tabular-nums;}
button,input,select{font-family:inherit; font-size:inherit; color:inherit;}
button{cursor:pointer;}

.topbar{position:sticky; top:var(--safe-t); z-index:20; background:var(--paper); border-bottom:1px solid var(--line); padding:10px 16px;}
.topbar-inner{display:flex; align-items:center; gap:12px; max-width:1000px; margin:0 auto; flex-wrap:wrap;}
.brand{display:flex; flex-direction:column; gap:1px; margin-right:auto; min-width:0;}
.brand .name{font-family:'Fraunces',serif; font-size:19px; font-weight:600; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.brand .course{font-size:12px; color:var(--muted);}
.nav{display:flex; gap:4px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:3px;}
.nav button{border:none; background:transparent; padding:7px 14px; border-radius:999px; font-size:13px; font-weight:600; color:var(--muted);}
.nav button.active{background:var(--green); color:#fff;}
.save-pill{font-size:12px; font-weight:600; padding:5px 10px; border-radius:999px; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;}
.save-pill.saved{background:var(--green-tint); color:var(--green-deep);}
.save-pill.saving{background:var(--line); color:var(--muted);}
.save-pill.pending{background:var(--line); color:var(--muted);}
.save-pill.error{background:var(--accent-tint); color:var(--accent); cursor:pointer;}
.dot{width:7px; height:7px; border-radius:50%; background:currentColor; flex:none;}

.view{max-width:760px; margin:0 auto; padding:20px 16px 64px;}
.view-wide{max-width:1040px;}
.section-title{font-size:22px; margin-bottom:4px;}
.section-sub{color:var(--muted); font-size:14px; margin-bottom:18px;}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:14px;}
.stack{display:flex; flex-direction:column; gap:14px;}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;}
.field{display:flex; flex-direction:column; gap:5px; flex:1; min-width:120px;}
.field label{font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.03em;}
.field input[type=text],.field input[type=number],.field select{
  border:1px solid var(--line); background:var(--paper); border-radius:8px; padding:10px 11px; min-height:42px; width:100%;
}
.field input:focus,.field select:focus,.btn:focus-visible{outline:2px solid var(--green); outline-offset:1px;}
.btn{border:1px solid var(--line); background:var(--surface); border-radius:9px; padding:10px 16px; font-weight:600; font-size:14px; min-height:42px;}
.btn-primary{background:var(--green); border-color:var(--green); color:#fff;}
.btn-danger{color:var(--danger); border-color:var(--accent-tint);}
.btn-sm{padding:6px 11px; min-height:32px; font-size:13px;}
.btn:disabled{opacity:.5; cursor:default;}
.icon-btn{border:none; background:transparent; padding:6px; border-radius:6px; color:var(--muted); min-height:auto;}
.icon-btn:hover{background:var(--line);}
.confirm-armed{color:#fff; background:var(--danger); animation:confirmPulse 1s ease-in-out infinite;}
.btn-danger.confirm-armed{background:var(--danger); color:#fff; border-color:var(--danger);}
@keyframes confirmPulse{0%,100%{opacity:1;} 50%{opacity:.65;}}

table{width:100%; border-collapse:collapse;}
th,td{text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); font-size:14px;}
th{font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); font-weight:600;}
td input[type=number],td input[type=text]{min-height:36px; border:1px solid var(--line); border-radius:6px; padding:4px 6px; background:var(--paper);}

.empty{text-align:center; padding:36px 16px; color:var(--muted);}
.empty h3{color:var(--ink); margin-bottom:6px; font-size:17px;}

.team-dot{width:10px; height:10px; border-radius:50%; flex:none; display:inline-block;}
.team-name-cell{display:flex; align-items:center; gap:8px; overflow:hidden;}
.team-name-text{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;}
.standings-table{table-layout:fixed;}
.standings-table td, .standings-table th{overflow:hidden;}

.match-row-item{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--line);}
.match-row-item:last-child{border-bottom:none;}
.match-title{font-weight:600; font-size:15px;}
.match-meta{font-size:12px; color:var(--muted); margin-top:2px;}

.status-header{background:var(--green-deep); color:#fff; border-radius:var(--radius); padding:16px; margin-bottom:14px;}
.status-header .names{display:flex; justify-content:space-between; font-size:14px; font-weight:600; margin-bottom:4px;}
.status-header .headline{font-family:'Fraunces',serif; font-size:28px; font-weight:600; text-align:center;}
.status-header .sub{text-align:center; font-size:12px; opacity:.8; margin-top:4px;}

.hole-btn-row{display:flex; gap:8px; margin-bottom:12px;}
.hole-btn{flex:1; padding:16px 8px; border-radius:10px; border:2px solid var(--line); background:var(--surface); font-weight:700; font-size:14px; min-height:66px; text-align:center; line-height:1.25;}
.hole-btn:active{transform:scale(.97);}
.hole-log{display:flex; gap:5px; flex-wrap:wrap; margin:12px 0;}
.hole-chip{min-width:26px; height:26px; padding:0 4px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:#fff;}
.score-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;}

.session-title{font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:700; margin:20px 0 8px;}
.session-title:first-of-type{margin-top:0;}
.contest-title{font-family:'Fraunces',Georgia,serif; font-weight:600; font-size:15px; margin:20px 0 8px; padding-bottom:6px; border-bottom:1px solid var(--line);}
.contest-title:first-of-type{margin-top:0;}
.contest-title-v{color:var(--muted); font-weight:400; font-family:'Inter',system-ui,sans-serif; font-size:13px;}
.display-contest-title{font-size:19px; margin-top:26px;}
.display-contest-title:first-of-type{margin-top:0;}
.embed-toggle{margin:22px 0 4px; text-align:center;}
.embed-toggle a{font-size:12px; color:var(--muted); text-decoration:underline; cursor:pointer;}
.embed-exit{margin:22px 0 4px; text-align:center; opacity:.3; transition:opacity .15s;}
.embed-exit:hover{opacity:1;}
.embed-exit a{font-size:11px; color:var(--muted); text-decoration:underline; cursor:pointer;}
.mc-names{font-weight:600; font-size:15px;}
.mc-format{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin-top:2px;}
.mc-result{font-family:'Fraunces',serif; font-weight:700; font-size:17px; flex:none; text-align:right;}
.mc-result.live{color:var(--green);}
.mc-result.done{color:var(--ink);}

.banner{background:var(--accent-tint); border:1px solid var(--accent); color:var(--ink); border-radius:var(--radius); padding:12px 14px; margin-bottom:16px; font-size:14px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}
.example-banner{background:var(--green-tint); border:1px solid var(--green);}

.pool-block{margin-bottom:26px;}
.pool-block:last-child{margin-bottom:0;}

.roster-block{padding:14px 0; border-bottom:1px solid var(--line);}
.roster-block:last-child{border-bottom:none;}
.roster-team-head{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:4px;}
.roster-team-name{font-weight:600; font-size:14px; display:flex; align-items:center; gap:8px;}
.roster-logo-wrap{display:flex; align-items:center; gap:8px;}
.team-logo{border-radius:50%; object-fit:cover; flex:none; display:inline-block; border:1px solid var(--line);}
.team-logo-placeholder{border-radius:50%; flex:none; display:inline-flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:#fff; text-transform:uppercase;}
.chip-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
.player-chip{display:inline-flex; align-items:center; gap:5px; background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:5px 6px 5px 11px; font-size:13px;}
.chip-remove{border:none; background:transparent; color:var(--muted); padding:2px; border-radius:50%; line-height:1; min-height:auto; font-size:11px;}
.chip-remove:hover{background:var(--line); color:var(--ink);}

.roster-list{display:flex; flex-direction:column; gap:4px; margin-top:8px;}
.roster-row{display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:8px; background:var(--paper);}
.roster-row.is-reserve{opacity:.8; background:transparent; border:1px dashed var(--line);}
.roster-num{min-width:22px; height:22px; border-radius:50%; background:var(--green); color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:none;}
.roster-num.reserve-badge{background:var(--line); color:var(--muted); border-radius:6px; width:auto; min-width:auto; padding:0 6px; font-size:10px; letter-spacing:.03em; text-transform:uppercase;}
.roster-name{flex:1; font-size:14px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.roster-controls{display:flex; align-items:center; gap:2px; flex:none;}
.roster-controls .icon-btn{padding:4px 5px; font-size:12px;}
.roster-reserve-toggle{font-size:11px; font-weight:600; border:1px solid var(--line); background:var(--surface); border-radius:6px; padding:4px 7px; min-height:auto; color:var(--muted); white-space:nowrap;}
.roster-reserve-toggle.active{color:var(--accent); border-color:var(--accent-tint); background:var(--accent-tint);}

.seg{display:flex; gap:6px; flex-wrap:wrap;}
.seg-btn{flex:1; min-width:100px; padding:12px 8px; border-radius:9px; border:2px solid var(--line); background:var(--surface); font-weight:600; font-size:13px;}
.seg-btn.active{border-color:var(--green); background:var(--green-tint); color:var(--green-deep);}

.nav{flex-wrap:wrap;}
.nav button{padding:7px 11px;}

/* --- Result entry table --- */
.re-picker-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
.re-table-wrap{overflow-x:auto;}
.re-row{border-bottom:1px solid var(--line);}
.re-row:last-child{border-bottom:none;}
.re-row-main{display:flex; align-items:center; gap:8px; padding:10px 4px; flex-wrap:wrap;}
.re-row.status-completed .re-row-main{background:var(--green-tint);}
.re-row.status-in_progress .re-row-main{background:var(--accent-tint);}
.re-side-name{flex:1; min-width:110px; font-weight:600; font-size:13px;}
.re-side-name.side-b{text-align:right;}
.re-outcome{min-width:150px; flex:none;}
.re-score{min-width:100px; flex:none;}
.re-live-inputs{display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--muted); flex:none; white-space:nowrap;}
.re-live-inputs input[type=number]{width:48px; min-height:32px; border:1px solid var(--line); border-radius:6px; padding:4px 5px; background:var(--paper); text-align:center;}
.re-status-chip{font-size:10px; text-transform:uppercase; letter-spacing:.03em; font-weight:700; color:var(--muted); flex:none; min-width:64px; text-align:center;}
.re-row.status-completed .re-status-chip{color:var(--green-deep);}
.re-row.status-in_progress .re-status-chip{color:var(--accent);}
.re-row-detail{padding:0 4px 14px;}

/* --- Schedule: round picker + per-contest match rows --- */
.sch-round-picker{display:flex; flex-wrap:wrap; align-items:flex-start; gap:16px;}
.sch-round-chips{display:flex; flex-wrap:wrap; gap:6px; padding-top:22px;}
.sch-round-chip{border:1px solid var(--line); background:var(--paper); border-radius:999px; padding:7px 13px; font-size:13px; font-weight:600; color:var(--muted); min-height:auto;}
.sch-round-chip.active{background:var(--green); border-color:var(--green); color:#fff;}
.sch-contest-head{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px;}
.sch-match-row{display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--line); flex-wrap:wrap;}
.sch-match-row:last-of-type{border-bottom:none;}
.sch-pos{font-size:11px; font-weight:700; color:var(--muted); min-width:70px; flex:none;}
.sch-match-row select{min-width:140px; flex:1;}
.sch-vs{font-size:12px; color:var(--muted); flex:none;}
.sch-meta{font-size:12px; color:var(--muted); flex:none; min-width:90px;}

/* --- Ryder-Cup style match card (public leaderboard / big screen) --- */
.rc-match{display:flex; align-items:stretch; gap:0; border-radius:12px; overflow:hidden; margin-bottom:10px; border:1px solid var(--line); background:var(--surface);}
.rc-side{flex:1; display:flex; align-items:center; gap:10px; padding:12px 14px; color:#fff; min-width:0;}
.rc-side.side-b{flex-direction:row-reverse; text-align:right;}
.rc-logo{width:32px; height:32px; border-radius:50%; object-fit:cover; border:2px solid rgba(255,255,255,.8); flex:none; background:rgba(255,255,255,.15);}
.rc-logo-fallback{width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:11px; background:rgba(255,255,255,.22); flex:none;}
.rc-name{min-width:0;}
.rc-primary{font-weight:700; font-size:13px; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.rc-secondary{font-size:11px; opacity:.85; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.rc-center{flex:0 0 108px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8px 4px; background:var(--paper); text-align:center;}
.rc-center .rc-meta{font-size:9px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:700;}
.rc-center .rc-score{font-family:'Fraunces',serif; font-weight:700; font-size:17px; margin-top:2px; color:var(--ink);}
.rc-center .rc-score.live{color:var(--green);}

/* --- Big screen display --- */
.display-wrap{padding:28px 32px; max-width:1400px; margin:0 auto;}
.display-header{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:18px;}
.display-header h1{font-size:34px;}
.display-header .course{color:var(--muted); font-size:16px;}
.display-session{font-size:16px;}
.display-grid{display:grid; grid-template-columns:1fr; gap:12px; margin-bottom:22px;}
.display-card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px 22px; display:flex; justify-content:space-between; align-items:center;}
.display-card .names{font-size:22px; font-weight:600;}
.display-card .fmt{font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-top:3px;}
.display-card .result{font-family:'Fraunces',serif; font-size:28px; font-weight:700; flex:none; margin-left:16px;}
.display-standings th, .display-standings td{font-size:16px; padding:10px 8px;}
.display-standings th{font-size:13px;}
.display-wrap .rc-primary{font-size:20px;}
.display-wrap .rc-secondary{font-size:13px;}
.display-wrap .rc-center{flex-basis:150px;}
.display-wrap .rc-center .rc-score{font-size:26px;}
.display-wrap .rc-logo,.display-wrap .rc-logo-fallback{width:44px; height:44px;}

@media (max-width:520px){
  .status-header .headline{font-size:21px;}
  .display-wrap{padding:18px 16px;}
  .display-card .names{font-size:17px;}
  .display-card .result{font-size:20px;}
  .hole-btn{font-size:12px; padding:14px 4px;}
  .rc-primary{font-size:12px;}
  .rc-secondary{display:none;}
  .rc-center{flex-basis:88px;}
  .rc-logo,.rc-logo-fallback{width:26px; height:26px;}
  .display-wrap .rc-center{flex-basis:100px;}
  .display-wrap .rc-center .rc-score{font-size:20px;}
  .sch-match-row select{min-width:100%;}
  .sch-pos{min-width:100%;}
  .sch-round-chips{padding-top:0;}
}

.viewer-msg{max-width:480px; margin:60px auto; text-align:center; padding:0 20px; color:var(--muted); font-family:'Inter',system-ui,sans-serif;}
.viewer-msg h2{font-family:'Fraunces',serif; color:var(--ink); margin-bottom:8px;}
.viewer-footer{max-width:900px; margin:28px auto 40px; text-align:center; font-size:11px; color:var(--muted); opacity:.6;}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="name" id="brand-name">Leaderboard</div>
      <div class="course" id="brand-course"></div>
    </div>
    <span class="save-pill pending" id="live-pill"><span class="dot"></span><span id="live-pill-text">Connecting…</span></span>
  </div>
</header>
<main class="view" id="app-root"></main>
<div class="viewer-footer">Live leaderboard — updates automatically as scores come in.</div>

<script>
(function () {
  'use strict';

  /* ============================ decode payload ============================ */
  function base64UrlToBytes(s) {
    var b64 = s.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    var binary = atob(b64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }
  function decompressGzip(bytes) {
    if (typeof DecompressionStream !== 'function') return Promise.reject(new Error('no-decompression-stream'));
    var ds = new DecompressionStream('gzip');
    var writer = ds.writable.getWriter();
    writer.write(bytes); writer.close();
    var chunks = [];
    var reader = ds.readable.getReader();
    var pump = function () {
      return reader.read().then(function (res) {
        if (res.done) return;
        chunks.push(res.value);
        return pump();
      });
    };
    return pump().then(function () {
      var total = chunks.reduce(function (sum, c) { return sum + c.length; }, 0);
      var merged = new Uint8Array(total), offset = 0;
      chunks.forEach(function (c) { merged.set(c, offset); offset += c.length; });
      return merged;
    });
  }
  function loadPayload() {
    var m = location.search.match(/[?&]view=([^&]*)/);
    if (!m || !m[1]) return Promise.resolve(null);
    var raw = decodeURIComponent(m[1]);
    var isGzip = raw.slice(0, 3) === 'gz.';
    var isRaw = raw.slice(0, 4) === 'raw.';
    var enc = isGzip ? raw.slice(3) : isRaw ? raw.slice(4) : raw;
    var bytes = base64UrlToBytes(enc);
    var toJson = function (b) { return JSON.parse(new TextDecoder().decode(b)); };
    if (isGzip) {
      return decompressGzip(bytes).then(toJson).catch(function () { return null; });
    }
    try { return Promise.resolve(toJson(bytes)); } catch (e) { return Promise.resolve(null); }
  }

  /* ====================== payload -> app-shaped STATE ====================== */
  var STATE = { eventName: '', courseName: '', pointsForWin: 1, pointsForHalve: 0.5, pools: [], teams: [], matches: [], playoffWinners: {} };
  function applyPayload(p) {
    STATE.eventName = p.n || '';
    STATE.courseName = p.c || '';
    STATE.pointsForWin = typeof p.pw === 'number' ? p.pw : 1;
    STATE.pointsForHalve = typeof p.ph === 'number' ? p.ph : 0.5;
    STATE.pools = (p.pools || []).map(function (pl) { return { id: pl.id, name: pl.name }; });
    STATE.teams = (p.teams || []).map(function (t) { return { id: t.id, name: t.n, color: t.c, poolId: t.p || null }; });
    STATE.matches = (p.matches || []).map(function (m) {
      return {
        id: m.id, session: m.s || '', teamAId: m.a, teamBId: m.b, format: m.f || '', holes: m.h,
        finished: !!m.fin, directUp: m.u || 0, directThru: m.t || 0, scoringMode: m.mode || 'holebyhole',
        holeLog: m.l || []
      };
    });
    STATE.playoffWinners = p.pf || {};
  }

  /* =========================== engine (ported) =========================== */
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function teamById(id) { return STATE.teams.filter(function (t) { return t.id === id; })[0] || null; }
  function teamName(id) { var t = teamById(id); return t ? t.name : 'Unknown team'; }
  function teamBadgeHtml(t) {
    return '<span class="team-dot" style="background:' + ((t && t.color) || '#888') + '"></span>';
  }
  // Picks black or white text so it stays readable on a team's own color —
  // ported unchanged from the main scoring app.
  function contrastTextColor(hex) {
    var h = ((hex || '') + '').replace('#', '');
    if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join('');
    if (!/^[0-9a-fA-F]{6}$/.test(h)) return '#fff';
    var r = parseInt(h.substr(0, 2), 16), g = parseInt(h.substr(2, 2), 16), b = parseInt(h.substr(4, 2), 16);
    var yiq = (r * 299 + g * 587 + b * 114) / 1000;
    return yiq >= 160 ? '#14171a' : '#fff';
  }

  function computeMatchStatusFromLog(holeLog, totalHoles) {
    var holesUp = 0, holesPlayed = 0, decidedAtHole = null;
    for (var i = 0; i < holeLog.length; i++) {
      if (decidedAtHole !== null) break;
      var w = holeLog[i];
      if (w === 'A') holesUp += 1; else if (w === 'B') holesUp -= 1;
      holesPlayed += 1;
      var remaining = totalHoles - holesPlayed;
      if (Math.abs(holesUp) > remaining) decidedAtHole = holesPlayed;
    }
    var status, winner, resultText;
    if (holesPlayed === 0) {
      status = 'not_started'; winner = null; resultText = 'Not started';
    } else if (decidedAtHole !== null) {
      status = 'completed'; winner = holesUp > 0 ? 'A' : 'B';
      resultText = Math.abs(holesUp) + '&' + (totalHoles - decidedAtHole);
    } else if (holesPlayed === totalHoles) {
      status = 'completed';
      if (holesUp === 0) { winner = 'halved'; resultText = 'Halved'; }
      else { winner = holesUp > 0 ? 'A' : 'B'; resultText = Math.abs(holesUp) + ' UP'; }
    } else {
      status = 'in_progress'; winner = null;
      resultText = (holesUp === 0 ? 'AS' : Math.abs(holesUp) + ' UP') + ' thru ' + holesPlayed;
    }
    return { holesUp: holesUp, holesPlayed: holesPlayed, status: status, winner: winner, resultText: resultText, decidedAtHole: decidedAtHole };
  }
  function directMatchStatus(match) {
    var up = match.directUp || 0;
    var thru = Math.max(0, Math.min(match.holes, match.directThru || 0));
    var remaining = match.holes - thru;
    var status, winner, resultText;
    if (match.finished) {
      status = 'completed';
      winner = up === 0 ? 'halved' : (up > 0 ? 'A' : 'B');
      if (up === 0) resultText = 'Halved';
      else if (remaining > 0 && Math.abs(up) > remaining) resultText = Math.abs(up) + '&' + remaining;
      else resultText = Math.abs(up) + ' UP';
    } else if (thru === 0 && up === 0) {
      status = 'not_started'; winner = null; resultText = 'Not started';
    } else {
      status = 'in_progress'; winner = null;
      resultText = (up === 0 ? 'AS' : Math.abs(up) + ' UP') + ' thru ' + thru;
    }
    return { holesUp: up, holesPlayed: thru, status: status, winner: winner, resultText: resultText, decidedAtHole: null };
  }
  function getMatchStatus(match) {
    if (match.scoringMode === 'direct') return directMatchStatus(match);
    var s = computeMatchStatusFromLog(match.holeLog, match.holes);
    if (match.finished && s.status !== 'completed') {
      s.status = 'completed';
      s.winner = s.holesUp === 0 ? 'halved' : (s.holesUp > 0 ? 'A' : 'B');
      s.resultText = (s.holesUp === 0 ? 'Halved' : (Math.abs(s.holesUp) + ' UP')) + ' (final)';
    }
    return s;
  }
  function contestKeyFor(m) { return [m.teamAId, m.teamBId].slice().sort().join('|'); }
  function computeContests(matches) {
    var order = [], byKey = {};
    matches.forEach(function (m) {
      var round = m.session || 'Matches';
      var contestKey = contestKeyFor(m);
      var key = round + '|' + contestKey;
      if (!byKey[key]) { byKey[key] = { round: round, contestKey: contestKey, teamAId: m.teamAId, teamBId: m.teamBId, matches: [] }; order.push(key); }
      byKey[key].matches.push(m);
    });
    return order.map(function (k) { return byKey[k]; });
  }
  function playoffKeyFor(round, contestKey) { return round + '|' + contestKey; }
  function contestResult(contest) {
    var complete = contest.matches.length > 0 && contest.matches.every(function (m) { return getMatchStatus(m).status === 'completed'; });
    var mpA = 0, mpB = 0;
    contest.matches.forEach(function (m) {
      var s = getMatchStatus(m);
      if (s.status !== 'completed') return;
      var flipped = m.teamAId !== contest.teamAId;
      if (s.winner === 'halved') { mpA += 0.5; mpB += 0.5; }
      else if ((s.winner === 'A') !== flipped) mpA += 1; else mpB += 1;
    });
    return { complete: complete, mpA: mpA, mpB: mpB };
  }
  function computeStandings(teams, matches, pointsForWin, pointsForHalve, playoffWinners) {
    playoffWinners = playoffWinners || {};
    var table = {};
    teams.forEach(function (t) { table[t.id] = { teamId: t.id, played: 0, won: 0, halved: 0, lost: 0, pts: 0, matchPoints: 0 }; });
    computeContests(matches).forEach(function (c) {
      var r = contestResult(c);
      if (!r.complete) return;
      var outcome;
      if (r.mpA !== r.mpB) {
        outcome = r.mpA > r.mpB ? 'A' : 'B';
      } else {
        var pw = playoffWinners[playoffKeyFor(c.round, c.contestKey)];
        outcome = pw === c.teamAId ? 'A' : pw === c.teamBId ? 'B' : 'halved';
      }
      [{ id: c.teamAId, mp: r.mpA, side: 'A' }, { id: c.teamBId, mp: r.mpB, side: 'B' }].forEach(function (entry) {
        var row = table[entry.id];
        if (!row) return;
        row.played += 1;
        row.matchPoints += entry.mp;
        if (outcome === 'halved') { row.halved += 1; row.pts += pointsForHalve; }
        else if (outcome === entry.side) { row.won += 1; row.pts += pointsForWin; }
        else { row.lost += 1; }
      });
    });
    return table;
  }
  function standingsGroups() {
    var groups = [];
    STATE.pools.forEach(function (p) {
      groups.push({ id: p.id, name: p.name, teams: STATE.teams.filter(function (t) { return t.poolId === p.id; }) });
    });
    var unpooled = STATE.teams.filter(function (t) { return !t.poolId; });
    if (unpooled.length) groups.push({ id: null, name: STATE.pools.length ? 'Other teams' : 'Standings', teams: unpooled });
    return groups.filter(function (g) { return g.teams.length > 0; });
  }
  function fmtPts(n) { return (Math.round(n * 2) / 2).toString().replace(/\.0$/, ''); }
  function standingsTableHtml(group, cls) {
    var table = computeStandings(group.teams, STATE.matches, STATE.pointsForWin, STATE.pointsForHalve, STATE.playoffWinners);
    var rows = group.teams.slice().sort(function (a, b) {
      var ta = table[a.id], tb = table[b.id];
      if (tb.pts !== ta.pts) return tb.pts - ta.pts;
      return tb.matchPoints - ta.matchPoints;
    });
    var html = '<table class="standings-table ' + (cls || '') + '"><colgroup><col style="width:40%">' +
      '<col style="width:10%"><col style="width:10%"><col style="width:10%"><col style="width:10%"><col style="width:10%"><col style="width:10%"></colgroup>' +
      '<thead><tr><th>Team</th><th>P</th><th>W</th><th>H</th><th>L</th><th title="Match points — individual matches won within each contest">MP</th><th title="Contest points — 1 for winning a whole team pairing, 0.5 if halved">Pts</th></tr></thead><tbody>';
    rows.forEach(function (t) {
      var row = table[t.id];
      html += '<tr><td class="team-name-cell">' + teamBadgeHtml(t) + '<span class="team-name-text">' + escapeHtml(t.name) + '</span></td>' +
        '<td class="tabular">' + row.played + '</td><td class="tabular">' + row.won + '</td><td class="tabular">' + row.halved + '</td><td class="tabular">' + row.lost + '</td>' +
        '<td class="tabular">' + fmtPts(row.matchPoints) + '</td><td class="tabular" style="font-weight:700;">' + fmtPts(row.pts) + '</td></tr>';
    });
    html += '</tbody></table>';
    return html;
  }
  function matchListWithStatus() { return STATE.matches.map(function (m) { return { match: m, status: getMatchStatus(m) }; }); }
  function groupBySession(list) {
    var order = [], groups = {};
    list.forEach(function (item) {
      var key = item.match.session || 'Matches';
      if (!groups[key]) { groups[key] = []; order.push(key); }
      groups[key].push(item);
    });
    return order.map(function (key) { return { session: key, items: groups[key] }; });
  }
  function activeRoundForBoard(groups) {
    for (var i = 0; i < groups.length; i++) {
      var allDone = groups[i].items.every(function (it) { return it.status.status === 'completed'; });
      if (!allDone) return groups[i].session;
    }
    return groups.length ? groups[groups.length - 1].session : null;
  }
  function groupItemsByContest(items) {
    var order = [], groups = {};
    items.forEach(function (item) {
      var key = contestKeyFor(item.match);
      if (!groups[key]) { groups[key] = { teamAId: item.match.teamAId, teamBId: item.match.teamBId, items: [] }; order.push(key); }
      groups[key].items.push(item);
    });
    return order.map(function (key) { return groups[key]; });
  }
  // No player rosters in a share-link payload (keeps the link small) — cards
  // show just the team name and a colored initials badge, same fallback the
  // main app uses when a match has no players assigned yet.
  function rcLogoHtml(t) {
    var initials = ((t && t.name) || '?').trim().slice(0, 2).toUpperCase();
    return '<span class="rc-logo-fallback">' + escapeHtml(initials) + '</span>';
  }
  var RC_NEUTRAL = '#8a8a80';
  function rcLeaderSide(s) {
    if (s.status === 'completed') { if (s.winner === 'A') return 'A'; if (s.winner === 'B') return 'B'; return null; }
    if (s.status === 'in_progress') { if (s.holesUp > 0) return 'A'; if (s.holesUp < 0) return 'B'; return null; }
    return null;
  }
  function rcSideHtml(team, side, leader) {
    var teamColor = (team && team.color) || '#888';
    var bg = (leader === null || leader === side) ? teamColor : RC_NEUTRAL;
    var fg = contrastTextColor(bg);
    var teamLabel = escapeHtml((team && team.name) || 'Unknown team');
    return '<div class="rc-side side-' + (side === 'A' ? 'a' : 'b') + '" style="background:' + bg + '; color:' + fg + ';">' + rcLogoHtml(team) +
      '<div class="rc-name"><div class="rc-primary">' + teamLabel + '</div></div></div>';
  }
  function rcMatchCardHtml(item) {
    var m = item.match, s = item.status;
    var teamA = teamById(m.teamAId), teamB = teamById(m.teamBId);
    var leader = rcLeaderSide(s);
    var centerLabel, scoreCls = 'rc-score';
    if (s.status === 'completed') {
      centerLabel = 'Final';
      var winLabel = s.winner === 'halved' ? 'Halved' : (escapeHtml(teamName(s.winner === 'A' ? m.teamAId : m.teamBId)) + ' ' + escapeHtml(s.resultText));
      var scoreText = s.winner === 'halved' ? 'Halved' : escapeHtml(s.resultText);
      return '<div class="rc-match" aria-label="' + winLabel + '">' +
        rcSideHtml(teamA, 'A', leader) +
        '<div class="rc-center"><div class="rc-meta">Match' + (m.format ? ' · ' + escapeHtml(m.format) : '') + ' — ' + centerLabel + '</div><div class="' + scoreCls + '">' + scoreText + '</div></div>' +
        rcSideHtml(teamB, 'B', leader) +
        '</div>';
    }
    centerLabel = s.status === 'in_progress' ? 'Live' : 'Upcoming';
    scoreCls += s.status === 'in_progress' ? ' live' : '';
    var liveScore = s.status === 'in_progress' ? escapeHtml(s.resultText) : '—';
    return '<div class="rc-match">' +
      rcSideHtml(teamA, 'A', leader) +
      '<div class="rc-center"><div class="rc-meta">Match' + (m.format ? ' · ' + escapeHtml(m.format) : '') + ' — ' + centerLabel + '</div><div class="' + scoreCls + '">' + liveScore + '</div></div>' +
      rcSideHtml(teamB, 'B', leader) +
      '</div>';
  }


  /* =============================== render =============================== */
  var boardState = { round: null };
  function renderMessage(title, body) {
    document.getElementById('app-root').innerHTML =
      '<div class="viewer-msg"><h2>' + escapeHtml(title) + '</h2><p>' + escapeHtml(body) + '</p></div>';
  }
  function renderLeaderboard() {
    document.getElementById('brand-name').textContent = STATE.eventName || 'Leaderboard';
    document.getElementById('brand-course').textContent = STATE.courseName || '';
    var el = document.getElementById('app-root');
    if (!STATE.teams.length) { renderMessage('No data', 'This link doesn\'t have any team data in it.'); return; }
    var html = '';
    standingsGroups().forEach(function (g) {
      html += '<div class="pool-block"><div class="session-title">' + escapeHtml(g.name) + ' standings</div><div class="card">' + standingsTableHtml(g) + '</div></div>';
    });
    if (STATE.matches.length) {
      var groups = groupBySession(matchListWithStatus());
      if (!boardState.round || !groups.some(function (g) { return g.session === boardState.round; })) {
        boardState.round = activeRoundForBoard(groups);
      }
      if (groups.length > 1) {
        html += '<div class="field" style="max-width:280px; margin-bottom:14px;"><label>Round</label><select id="board-round-select">' +
          groups.map(function (g) {
            return '<option value="' + escapeHtml(g.session) + '" ' + (g.session === boardState.round ? 'selected' : '') + '>' + escapeHtml(g.session) + '</option>';
          }).join('') + '</select></div>';
      }
      var current = groups.filter(function (g) { return g.session === boardState.round; })[0] || groups[0];
      if (current) {
        html += '<div class="session-title">' + escapeHtml(current.session) + '</div>';
        groupItemsByContest(current.items).forEach(function (c) {
          html += '<div class="contest-title">' + escapeHtml(teamName(c.teamAId)) + ' <span class="contest-title-v">v</span> ' + escapeHtml(teamName(c.teamBId)) + '</div>';
          c.items.forEach(function (item) { html += rcMatchCardHtml(item); });
        });
      }
    }
    el.innerHTML = html;
    var sel = document.getElementById('board-round-select');
    if (sel) sel.addEventListener('change', function () { boardState.round = this.value; renderLeaderboard(); });
  }

  /* =============================== live sync =============================== */
  // This page's real data source: a public (read-only, no auth needed)
  // Firebase Realtime Database node that the admin app keeps pushing to as
  // scores change. Subscribing via EventSource opens one persistent
  // connection and gets pushed every update instantly — no refreshing, no
  // re-sharing a link, nothing for whoever's looking at this page to do.
  // A slow poll runs alongside it as a safety net in case that streaming
  // connection is silently blocked by a network (some venue wifi/proxies do
  // this to long-lived connections without erroring), and steps back once
  // the stream proves itself.
  var FIREBASE_DB_URL = 'https://junior-girls-interprov-default-rtdb.firebaseio.com';
  var FIREBASE_EVENT_ID = 'live';
  var haveData = false;
  var lastLiveTs = 0;
  function setLivePill(state, text) {
    var pill = document.getElementById('live-pill');
    var t = document.getElementById('live-pill-text');
    if (!pill) return;
    pill.className = 'save-pill ' + state;
    if (t) t.textContent = text;
  }
  // isLive: true for anything that came from the Firebase feed (stream or
  // poll) — those carry a `ts` the admin app stamps on every push, so a
  // late-arriving poll response can't clobber a newer streamed update. The
  // one-time `?view=` snapshot decode (if any) has no `ts` and always just
  // applies immediately as a fast first paint.
  function tryApplyPayload(p, isLive) {
    if (!p) return;
    if (isLive) {
      var ts = p.ts || 0;
      if (ts && ts <= lastLiveTs) return;
      lastLiveTs = ts;
    }
    haveData = true;
    try {
      applyPayload(p);
      renderLeaderboard();
    } catch (e) {
      renderMessage('Couldn\'t read live data', 'Something about the live leaderboard data didn\'t match what this page expects.');
    }
  }
  var pollTimer = null;
  function pollOnce() {
    fetch(FIREBASE_DB_URL + '/leaderboards/' + FIREBASE_EVENT_ID + '.json')
      .then(function (r) { return r.json(); })
      .then(function (p) { tryApplyPayload(p, true); })
      .catch(function () {});
  }
  function startPolling() {
    if (pollTimer) return;
    pollTimer = setInterval(pollOnce, 20000);
    pollOnce();
  }
  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }
  function subscribeLive() {
    if (typeof EventSource !== 'function') { startPolling(); return; }
    var sseConfirmed = false;
    var fallbackTimer = setTimeout(function () { if (!sseConfirmed) startPolling(); }, 8000);
    try {
      var es = new EventSource(FIREBASE_DB_URL + '/leaderboards/' + FIREBASE_EVENT_ID + '.json');
      es.addEventListener('put', function (e) {
        sseConfirmed = true;
        clearTimeout(fallbackTimer);
        stopPolling();
        setLivePill('saved', 'Live');
        try {
          var msg = JSON.parse(e.data);
          tryApplyPayload(msg && msg.data, true);
          if (!haveData) renderMessage('Waiting for scores', 'The organizer hasn\'t started this event yet — this page will update the moment they do.');
        } catch (err) {}
      });
      es.addEventListener('patch', function () { /* admin always writes the whole node, so nothing to merge */ });
      es.onerror = function () {
        setLivePill('pending', 'Reconnecting…');
        startPolling();
      };
    } catch (e) {
      startPolling();
    }
  }

  renderMessage('Connecting…', 'Loading the live leaderboard.');
  loadPayload().then(function (p) {
    if (p) { try { tryApplyPayload(p); } catch (e) {} }
    subscribeLive();
  });
})();
</script>
</body>
</html>
